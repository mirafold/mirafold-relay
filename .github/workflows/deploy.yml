name: Deploy

# Manual-dispatch deploy (Kyle's call, 2026-07-22): deployment is gated on a
# human clicking "Run workflow" and choosing the ref to deploy — nothing here
# runs on push, merge, or schedule. The branch/tag picker in the dispatch UI
# is the "which ref deploys" choice; the environment dropdown picks staging
# (default — genui-relay-staging, fly.staging.toml, idles at zero) or
# production (genui-relay). R.5d flow: deploy a ref to staging → smoke →
# dispatch the SAME ref to production.
#
# INERT UNTIL CONFIGURED: this job needs a FLY_API_TOKEN repo secret (create
# one with `fly tokens create deploy -a genui-relay` after `fly auth login`,
# then add it under Settings → Secrets and variables → Actions). Without the
# secret the job fails immediately at auth and deploys nothing.
#
# Scope: REPEAT deploys of an existing app only. Deploy day's one-time steps —
# `fly apps create`, certs, DNS, the smoke check — stay manual and live in
# DEPLOY.md. flyctl is installed from Fly's official installer rather than a
# third-party action, so no unpinned action ever sees the token.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        type: choice
        default: staging
        options: [staging, production]

permissions:
  contents: read

# Never two deploys at once; a second dispatch waits (no cancel — an
# interrupted `fly deploy` is worse than a queued one).
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    # Each GitHub Environment holds its own FLY_API_TOKEN, scoped to only
    # its app (fly tokens create deploy -a <app>): staging's token cannot
    # touch production and vice versa.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      # Pinned version, not "latest": the installer is `curl | sh`, so an
      # unpinned run would fetch and execute whatever the script resolves to
      # that day — a tampered release could plant a trojaned flyctl that the
      # deploy step below then runs WITH FLY_API_TOKEN in scope. Pinning makes
      # the installed binary deterministic and reviewable. Bump deliberately.
      # The token is intentionally NOT in this step's env (only the deploy +
      # status steps), so the fetch itself never sees it.
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh -s v0.4.74
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      # --ha=false: pair affinity needs exactly ONE machine (DEPLOY.md §1);
      # harmless on an existing single-machine app, load-bearing if the app
      # was ever recreated.
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --config "$FLY_CONFIG"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_CONFIG: ${{ inputs.environment == 'staging' && 'fly.staging.toml' || 'fly.toml' }}
      - name: Status
        run: flyctl status --config "$FLY_CONFIG"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_CONFIG: ${{ inputs.environment == 'staging' && 'fly.staging.toml' || 'fly.toml' }}
